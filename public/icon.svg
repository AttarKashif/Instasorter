<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cobalt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="slate-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>
  
  <!-- Smooth squircle background -->
  <rect width="512" height="512" rx="140" fill="url(#bg-grad)" />
  
  <!-- Subtle gallery grid pattern background -->
  <g opacity="0.15" stroke="#475569" stroke-width="4" stroke-dasharray="8 8">
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="384" x2="512" y2="384" />
  </g>
  
  <!-- Brand logo: Intersecting modern UI card elements & Sparkle -->
  <g transform="translate(116, 116)">
    <!-- Card 1: Large primary image box (curated photo representation) -->
    <rect x="0" y="0" width="130" height="180" rx="24" fill="url(#cobalt-grad)" />
    <!-- Inner image detail placeholder line inside Card 1 -->
    <rect x="24" y="128" width="82" height="12" rx="6" fill="#ffffff" opacity="0.3" />
    <circle cx="40" cy="40" r="16" fill="#ffffff" opacity="0.4" />
    
    <!-- Card 2: Secondary horizontal info box -->
    <rect x="150" y="0" width="130" height="100" rx="20" fill="url(#slate-grad)" />
    <rect x="174" y="60" width="82" height="8" rx="4" fill="#ffffff" opacity="0.25" />
    
    <!-- Card 3: Lower right highlight box -->
    <rect x="150" y="120" width="130" height="160" rx="24" fill="#1e293b" stroke="#3b82f6" stroke-width="6" />
    <line x1="174" y1="160" x2="256" y2="160" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" />
    <line x1="174" y1="184" x2="230" y2="184" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />
    <circle cx="215" cy="225" r="12" fill="#ef4444" />
    
    <!-- Card 4: Lower left tag / filter accent chip -->
    <rect x="0" y="200" width="130" height="80" rx="20" fill="#09090b" stroke="#1e293b" stroke-width="4" />
    <!-- Dynamic tag text mock lines -->
    <line x1="20" y1="240" x2="110" y2="240" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
  </g>
  
  <!-- Central Sparkle - Represents "AI Smart/Curator sorting precision" -->
  <path d="M256 180 C256 230 230 256 180 256 C230 256 256 282 256 332 C256 282 282 256 332 256 C282 256 256 230 256 180 Z" fill="#ffffff" />
</svg>
